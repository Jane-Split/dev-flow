### Step 3: Code Implementation

**Implementation order** (within single service):
1. Entity / Enum - data models
2. DTO - data transfer objects
3. Mapper / Repository - data access layer
4. Service Interface - service interfaces
5. Service Implementation - service implementations
6. Controller - controllers

**🔴🔴 Logic Step Annotation Specification (must comply)**:

> **Purpose**: Let each logic step have a clear anchor in code, so Step 4.3 logic backtracking verification can be automated.

**Rule**: When design-contract.yaml defines logic steps, Service implementation classes must annotate each step with comments:

```java
// Step 1: validate - validate order parameters
if (orderDTO == null || orderDTO.getId() == null) {
    throw new BusinessException("Order parameters cannot be empty");
}

// Step 2: query - check if order exists
OrderEntity existing = orderMapper.selectById(orderDTO.getId());
if (existing == null) {
    throw new BusinessException("Order does not exist");
}

// Step 3: branch - determine order status
if (existing.getStatus() == OrderStatus.DRAFT.getCode()) {
    // Step 3.1: call - call SAP push
    SapResponse response = sapFeignClient.pushOrder(convertToSapDTO(existing));
    if (!response.isSuccess()) {
        throw new BusinessException("SAP push failed: " + response.getErrorMsg());
    }
    // Step 3.2: assign - update order status
    existing.setStatus(OrderStatus.PUSHED.getCode());
    orderMapper.updateById(existing);
} else {
    // Step 3.3: throw - non-draft status not allowed to push
    throw new BusinessException("Order status is not draft, push not allowed");
}
```

**Annotation format requirements**:
- `// Step {N}: {action_type} - {description}` — must include step number, action type, short description
- Step numbers correspond one-to-one with logic step numbers in design-contract.yaml
- Action types use standard values: `validate` / `query` / `convert` / `assign` / `throw` / `return` / `call` / `branch`
- If design-contract.yaml does not define logic steps (simple requirements), no annotation needed

**Coding standards**:
- Follow project existing naming style
- Use project existing annotation patterns
- Add necessary comments (class comments, method comments, complex logic comments)
- Handle exceptions correctly
- Add logging

#### 🔴🔴 Step 3.5: Code Completeness Defense (execute immediately after each file write)

> **Purpose**: Immediately after writing each file, detect whether there are placeholders/empty implementations/TODOs and other incomplete code, and fix on the spot.
> **Timing**: Execute immediately after each file Write, do not wait for all files to be written.

**Detection process** (execute for each newly written file):

```
1. Scan placeholder patterns
   Grep "TODO" {file}
   Grep "FIXME" {file}
   Grep "NotImplementedError" {file}
   Grep "UnsupportedOperationException" {file}
   Grep "pass$" {file}  (Python)
   Grep "\{\/\*.*description.*\*\/\}" {file}  (frontend JSX)

2. Scan empty implementation patterns
   Grep "return null;" {file}
   Grep "data: null" {file}
   Grep "throw new UnsupportedOperationException" {file}

3. Scan log placeholder patterns (🔴 critical)
   For each public/protected method:
   - Extract method body ({ to })
   - Check if method body contains only log.info/log.warn/log.debug/log.error
   - If method body has only logs → mark as "log placeholder", must supplement business logic

4. Compare with design document
   - Check if each method in design has corresponding implementation in code
   - Check if each conditional branch in design has corresponding if/else in code
   - Check if each external call in design has actual call in code (not log)
```

**Handling when incomplete code is found**:

| Detection Result | Handling Method |
|---------|---------|
| Found TODO/FIXME | Immediately replace with complete business logic |
| Found return null | Immediately supplement actual return logic |
| Found log placeholder method body | Immediately supplement real business calls |
| Found empty method body | Immediately supplement complete implementation |
| Found missing conditional branch | Immediately supplement missing if/else |

**Mandatory rules**:
- Found any incomplete code → **Fix immediately, cannot delay**
- Re-scan after fix to confirm → Until all detection items pass
- Must not skip completeness check with "insufficient context" as excuse
- If context is indeed insufficient → Pause and report, rather than generate placeholder code

**Complete file standard**:
A file can only be marked as "complete" when all following conditions are met:
- [ ] No TODO/FIXME/NotImplementedError
- [ ] No return null (unless true null semantics, like Optional.empty())
- [ ] No empty method bodies (each method body has at least 3+ lines of substantive code)
- [ ] No log placeholders (method body cannot have only log calls)
- [ ] All methods in design have implementations
- [ ] All conditional branches have handling logic

### Step 4: Dependency Handling

**Maven/Gradle dependencies**:
- Check if new dependencies are needed
- Add in pom.xml / build.gradle

**Code dependencies**:
- Ensure imports are correct
- Ensure dependent classes exist or have been generated

### Step 5: Code Self-check (🔴 must execute before compilation)

**Basic checks**:
- Syntax correctness
- Type matching
- Method signature consistency
- Naming conventions
- Code formatting
- Comment completeness
- Null handling
- Exception handling
- Boundary conditions

**🔴 Mandatory check items (must pass)**:

| Check Item | Check Method | Pass Standard |
|--------|---------|---------|
| **Import paths** | Each import confirmed via Grep | ✅ All paths searchable |
| **Method calls** | Each method call corresponds to actual method read in Step 2.5 | ✅ Method name, parameter count, parameter types match exactly |
| **Type compatibility** | Each field assignment is type compatible | ✅ No implicit type conversion, or explicit conversion declared |
| **Field references** | Each field reference corresponds to actual field read in Step 2.5 | ✅ Field name, field type match exactly |

**Output pre-compilation self-check report**:
```markdown
### Pre-compilation Self-check Report

| Check Item | Status | Details |
|--------|------|------|
| Import paths | ✅ All confirmed | 12 imports, all passed Grep verification |
| Method calls | ✅ All matched | 8 method calls, all consistent with Step 2.5 read results |
| Type compatibility | ⚠️ 1 warning | `status = 1` → actual type is byte, needs explicit conversion |
| Field references | ✅ All matched | 5 field references, all consistent with Entity definitions |

**Issues to fix**:
1. `status = 1` → change to `status = (byte) 1`
```

**If any check item fails**:
1. **Must fix before continuing**
2. Do not claim "development complete"
3. Do not proceed to next file development

### Step 6: Generate Result Report

```yaml
# develop-result.yaml
task_id: <task ID>
domain: backend
status: success|partial|failed
files_generated:
  - path: file path
    type: entity|dto|mapper|service|controller|other
    description: file description
files_modified:
  - path: file path
    changes: modification summary
issues:
  - severity: warning|error
    file: problematic file
    message: problem description
    suggestion: suggestion
compilation_status: success|failed|not_tested
test_status: passed|failed|not_tested
```

## Parallel Development Notes

When multiple Develop Experts execute in parallel:

1. **Independent tasks**: Each subagent only handles tasks assigned to it
2. **Do not modify shared files**: If multiple tasks need to modify same file, Orchestrator handles serially
3. **Dependency declaration**: If generated code depends on results from other parallel tasks, declare in develop-result.yaml
4. **Conflict handling**: If conflicts found, mark as blocked, wait for Orchestrator coordination

