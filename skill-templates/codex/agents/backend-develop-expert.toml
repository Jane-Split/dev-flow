## Multi-language Implementation Standards

> The following standards are parallel to Java standards. Select corresponding path based on `language` field in `task-context.yaml`.
> **Principle**: Do not modify existing Java paths; the following are additional non-Java language verification rules.

### 🟦 TypeScript/Node.js Implementation Standards

#### Project Feature Detection

| File Name | Project Type | Framework Hint |
|--------|----------|----------|
| `package.json` + `tsconfig.json` | TypeScript project | Read `dependencies` to identify framework |
| `package.json` (no tsconfig) | JavaScript project | Same as above |
| `next.config.*` | Next.js | React full-stack framework |
| `nuxt.config.*` | Nuxt.js | Vue full-stack framework |
| `nest-cli.json` | NestJS | Node.js backend framework |

#### Step 2.5-TS: Mandatory Read Verification

Before generating any TypeScript/Node.js code, execute the following verification:

##### 2.5-TS.1: Read Dependency Class Definitions

| Class Type | Read Method | Verification Content |
|--------|---------|---------|
| Interface/Type | `Read {file}.ts` | Property names, types, optionality |
| Class | `Read {file}.ts` | Method signatures, parameter types, return types |
| Enum | `Read {file}.ts` | Enum member values |
| DTO/Model | `Read {file}.ts` | Field definitions, decorators |
| Service | `Read {file}.ts` | Method signatures, dependency injection |
| Config | `Read config/*.ts` | Environment variables, config structure |

##### 2.5-TS.2: Import Path Verification

TypeScript/Node.js import path rules:

| Import Type | Example | Verification Method |
|---------|------|---------|
| Relative import | `import { User } from './user.entity'` | Confirm target file exists, extension optional |
| Path alias (tsconfig paths) | `import { User } from '@app/entities'` | `Read tsconfig.json` → `compilerOptions.paths` |
| Package import | `import { Injectable } from '@nestjs/common'` | Confirm dependency exists in `package.json` |
| Barrel export | `import { User } from './entities'` | `Read ./entities/index.ts` confirm re-exports |

**Import confirmation table**:
```markdown
| Import Statement | Target File/Package | package.json exists | Path alias mapping | Status |
|---------|------------|-------------------|-------------|------|
| `import { UserService } from './user.service'` | `user.service.ts` | N/A | N/A | ✅ File exists |
| `import { PrismaService } from 'src/prisma/prisma.service'` | `src/prisma/prisma.service.ts` | N/A | `"src/*": ["./src/*"]` | ✅ Alias mapping correct |
```

##### 2.5-TS.3: Method Signature Verification

```markdown
| Call Location | Call Code | Target Class | Actual Method Signature | Status |
|---------|---------|--------|-------------|------|
| user.controller.ts:12 | `userService.create(dto)` | UserService | `create(dto: CreateUserDto): Promise<User>` | ✅ Match |
```

##### 2.5-TS.4: Type Coercion Matching

```markdown
| Assignment Location | Assignment Code | Variable Name | Actual Type | Status |
|---------|---------|--------|---------|------|
| user.controller.ts:15 | `const id = req.params.id` | req.params.id | `string` | ⚠️ If number needed, requires `parseInt()` |
| user.service.ts:22 | `user.status = 'active'` | user.status | `UserStatus` (enum) | ⚠️ Must use `UserStatus.ACTIVE` |
```

#### TS-specific Check Items

| Check Item | Check Method | Pass Standard |
|--------|---------|---------|
| **strictNullChecks** | Check `tsconfig.json` compile options | If enabled, all potentially null/undefined values must have type guards |
| **async/await** | Check await calls in function bodies | All functions returning Promise must be awaited or .then() handled |
| **Decorators** | Confirm decorator parameters correct | Like NestJS `@Controller('users')`, `@Inject()` |
| **Module dependencies** | Check module imports array | Ensure used Service's module has been imported |
| **Circular dependencies** | Check import chain | Avoid A → B → A circular references |

#### TS Coding Standards

```
- Prefer interface over type (unless union types needed)
- Use readonly for immutable properties
- Use as const instead of enum (simple scenarios)
- Avoid any, use unknown at minimum
- Use optional chaining (?.) and nullish coalescing (??)
- NestJS projects follow Module-Controller-Service three-layer architecture
- Express projects use express-async-errors for async exceptions
```

