## Workflow

### Step 1: Read Design Document

- Understand design intent
- Clarify interface definitions
- Confirm data models

### Step 2: Read Existing Code (precise on-demand)

**Only read files that need reference**:
- Existing files to be modified
- Base classes/interfaces to inherit/implement
- Utility classes to reference
- Existing methods to call

**Do not read unrelated files**:
- Other services' code
- Unrelated modules
- Historical versions

---

### 🔴 Step 2.5: Mandatory Read Verification (must execute)

> **⚠️ Iron rule**: Before generating any code, must read all dependency classes' **actual definitions**.
> **Prohibited behavior**: Guessing method names, types, import paths based on naming conventions.

#### Step 2.5.1: Read Dependency Class Definitions

| Class Type | Read Method | Verification Content |
|--------|---------|---------|
| Entity | `Read {EntityPath}.java` | Field names, field types, getter/setter method names |
| DTO | `Read {DTOPath}.java` | Field names, validation annotations, nested DTOs |
| Enum | `Read {EnumPath}.java` | Enum value names, enum methods |
| Service | `Read {ServicePath}.java` | Method signatures, parameter types, return types |
| Mapper | `Read {MapperPath}.java` | Method signatures, SQL annotations |
| Feign Client | `Read {FeignPath}.java` | Interface methods, paths, parameters |

**Output dependency class confirmation table**:
```markdown
| Class Name | Read Status | Key Findings | Confirmed |
|------|---------|---------|---------|
| QmsInspectionBatch | ✅ Read | status field type is byte, method name is getInspectionBatchStatus() | ✅ Confirmed |
| XxxDTO | ⏳ Pending | - | - |
```

#### Step 2.5.2: Import Path Verification

For each class that needs import:

1. **Search to confirm location**: `Grep "class Xxx" --glob="**/*.java"`
2. **Read to confirm**: If multiple found, read each file to confirm which is correct
3. **Record actual path**:

```markdown
| Class Name | Import Statement | Verification Method | Status |
|------|------------|---------|------|
| QmsBusinessException | import com.xxx.common.i18n.QmsBusinessException; | Grep search confirm | ✅ Correct |
```

#### Step 2.5.3: Method Signature Verification

For each method call:

1. **Read target class definition**
2. **Extract actual method list**
3. **Match call**: method name, parameter count, parameter types must match exactly

```markdown
| Call Location | Call Code | Target Class | Actual Method | Status |
|---------|---------|--------|---------|------|
| ServiceImpl:45 | batch.getStatus() | QmsInspectionBatch | ❌ Does not exist | Must change to getInspectionBatchStatus() |
```

#### Step 2.5.4: Type Coercion Matching

For each field assignment:

1. **Read actual field type**
2. **Type conversion check**: If not matching, must explicitly convert

```markdown
| Assignment Location | Assignment Code | Field Name | Actual Type | Status |
|---------|---------|--------|---------|------|
| ServiceImpl:30 | status = 1 | status | byte | ⚠️ Needs explicit conversion |
```

