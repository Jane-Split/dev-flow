#### Python-specific Check Items

| Check Item | Check Method | Pass Standard |
|--------|---------|---------|
| **Type annotations** | Check function signatures | All public methods have complete type annotations |
| **async/sync consistency** | Check call chain | FastAPI async endpoints do not use sync blocking calls |
| **Pydantic validation** | Check Schema definitions | Use Field() to add validation rules, not just type annotations |
| **Dependency injection** | Check FastAPI Depends() | Dependency injection chain complete and no cycles |
| **Database sessions** | Check Session management | Use `yield` or context manager to manage session lifecycle |
| **Virtual environment** | Check if venv/conda activated | `which python` confirm in virtual environment |

#### Python Coding Standards

```
- Follow PEP 8 code style
- Use f-string for string formatting (Python 3.6+)
- Use pathlib instead of os.path
- Use dataclass or Pydantic instead of dict for data passing
- FastAPI: Use dependency injection (Depends) instead of global variables
- Django: Follow MVT architecture, business logic in Service layer
- Use ruff or black for unified code formatting
```

### 🐹 Go Implementation Standards

#### Project Feature Detection

| File Name | Meaning | Framework Hint |
|--------|------|----------|
| `go.mod` | Go module definition | Module name + dependency list |
| `go.sum` | Dependency checksum | - |
| `main.go` | Entry file | Check imports for framework (gin/echo/fiber) |
| `cmd/` directory | Standard project layout | Multi-entry project |
| `internal/` directory | Internal packages | Cannot be imported externally |
| `pkg/` directory | Exportable packages | - |

#### Step 2.5-GO: Mandatory Read Verification

##### 2.5-GO.1: Read Dependency Definitions

| Type | Read Method | Verification Content |
|------|---------|---------|
| Struct | `Read {file}.go` | Field names (first letter case determines visibility), field types, tag |
| Interface | `Read {file}.go` | Method signature list |
| Func | `Read {file}.go` | Parameter types, return types, error return value |
| Const/Enum | `Read {file}.go` | Constant values, iota sequence |
| Config | `Read config/*.go` | Config struct field names and yaml/json tag |

##### 2.5-GO.2: Import Path Verification

Go import path rules:

| Import Type | Example | Verification Method |
|---------|------|---------|
| Standard library | `import "net/http"` | No verification needed, Go SDK built-in |
| Third-party package | `import "github.com/gin-gonic/gin"` | `grep` go.mod confirm dependency and version |
| Project internal package | `import "myproject/internal/user"` | Confirm directory and .go file exist |
| Alias import | `import userSvc "myproject/internal/user/service"` | Confirm alias does not conflict |

**Import confirmation table**:
```markdown
| Import Path | Type | go.mod exists | Version | Status |
|---------|------|------------|------|------|
| `github.com/gin-gonic/gin` | Third-party | ✅ | v1.9.1 | ✅ |
| `myapp/internal/user/model` | Internal | N/A | N/A | ✅ Directory exists |
```

##### 2.5-GO.3: Method/Function Signature Verification

Go receiver methods special format:

```markdown
| Call Location | Call Code | Target Type | Actual Signature | Status |
|---------|---------|---------|---------|------|
| handler/user.go:30 | `svc.Create(ctx, &user)` | UserService | `func (s *UserService) Create(ctx context.Context, u *User) (*User, error)` | ✅ Match |
```

##### 2.5-GO.4: Type Compatibility Verification

```markdown
| Assignment Location | Code | Target Type | Source Type | Status |
|---------|------|---------|--------|------|
| handler/user.go:35 | `id := c.Param("id")` | `int64` | `string` | ⚠️ Needs `strconv.ParseInt()` conversion |
| service/user.go:45 | `u.Status = 1` | `UserStatus` (custom type) | `int` | ⚠️ Needs `UserStatus(1)` explicit conversion |
```

#### Go-specific Check Items

| Check Item | Check Method | Pass Standard |
|--------|---------|---------|
| **error handling** | Check all calls returning error | Every error return value is checked, no `_` ignoring |
| **defer usage** | Check defer after resource opening | Files, connections and other resources immediately defer Close() after opening |
| **goroutine leaks** | Check context in go func() | All goroutines have exit mechanisms (context.Done/channel close) |
| **nil pointer** | Check pointer/interface before use | All pointers/interfaces/slices/maps have nil checks before use |
| **concurrency safety** | Check shared state access | Shared mutable state uses sync.Mutex or channel protection |
| **interface satisfaction** | Check if struct implements interface | Use `var _ Interface = (*Struct)(nil)` compile-time assertion |
| **naming visibility** | Check first letter case | Exported symbols first letter uppercase, internal symbols first letter lowercase |

#### Go Coding Standards

```
- Follow Effective Go and Go Code Review Comments
- Error handling: `if err != nil { return fmt.Errorf("context: %w", err) }`
- Use context.Context as first function parameter
- Prefer returning concrete types, accepting interface types
- Use gofumpt or gofmt for formatting
- Use golangci-lint for static checking
- Project layout follows golang-standards/project-layout
```

### 🔴 Frontend Component data-testid Specification (New)

> **Purpose**: Provide stable element positioning for UI layer verification (agent-browser), avoiding test instability caused by dependency on CSS class names or text content.

**Rule**: All key interactive elements involving UI verification must add `data-testid` attribute.

**Naming convention**:

| Element Type | data-testid Format | Example |
|---------|-----------------|------|
| Action button | `{action}-{resource}` | `data-testid="create-user"` |
| Delete button | `delete-{resource}-{id}` | `data-testid="delete-user-123"` |
| Form input | `input-{field}` | `data-testid="input-username"` |
| Dropdown select | `select-{field}` | `data-testid="select-status"` |
| Table | `table-{resource}` | `data-testid="table-users"` |
| Table row | `row-{resource}-{id}` | `data-testid="row-user-123"` |
| Modal | `modal-{name}` | `data-testid="modal-create-user"` |
| List item | `item-{resource}-{id}` | `data-testid="item-role-1"` |
| Search box | `search-{resource}` | `data-testid="search-user"` |
| Submit button | `submit-{action}` | `data-testid="submit-create"` |
| Cancel button | `cancel-{action}` | `data-testid="cancel-create"` |

**Vue component example**:

```vue
<template>
  <div>
    <button data-testid="create-user" @click="showCreateModal">Create User</button>
    <input data-testid="search-user" v-model="searchText" placeholder="Search user" />
    <button data-testid="search-submit" @click="search">Search</button>

    <a-modal data-testid="modal-create-user" v-model:visible="createVisible" title="Create User">
      <a-form>
        <a-form-item label="Username">
          <a-input data-testid="input-username" v-model:value="form.username" />
        </a-form-item>
        <a-form-item label="Email">
          <a-input data-testid="input-email" v-model:value="form.email" />
        </a-form-item>
      </a-form>
      <template #footer>
        <a-button data-testid="cancel-create" @click="createVisible = false">Cancel</a-button>
        <a-button data-testid="submit-create" type="primary" @click="handleCreate">Submit</a-button>
      </template>
    </a-modal>

    <a-table data-testid="table-users" :dataSource="users" :columns="columns">
      <template #bodyCell="{ record }">
        <a-button data-testid="delete-user" @click="handleDelete(record.id)">Delete</a-button>
      </template>
    </a-table>
  </div>
</template>
```

**React component example**:

```tsx
<button data-testid="create-user" onClick={showCreateModal}>Create User</button>
<input data-testid="input-username" value={form.username} onChange={handleChange} />
<button data-testid="submit-create" type="submit">Submit</button>
```

> **⚠️ Fallback compatibility**: If design-contract.yaml has no ui_selectors section, adding data-testid is not mandatory, but recommended to improve test stability.

