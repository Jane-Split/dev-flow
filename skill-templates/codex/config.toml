# dev-flow Codex project defaults
#
# This file is intentionally conservative. Codex only loads project-scoped
# .codex/config.toml after the project is trusted, and user/global settings
# still take precedence where appropriate.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "high"

# Multi-Agent configuration for dev-flow parallel execution
[agents]
max_threads = 6

# Register dev-flow subagents for parallel execution
# Each agent is defined in .codex/agents/*.toml
[[agents.register]]
name = "orchestrator"
description = "Task decomposition and result consolidation for dev-flow"
config_file = ".codex/agents/orchestrator.toml"

[[agents.register]]
name = "research-expert"
description = "Project scanning and memory building"
config_file = ".codex/agents/research-expert.toml"

