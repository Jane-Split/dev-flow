## 与其他 Agent 的协作\r
\r
### 与 backend-develop-expert / frontend-develop-expert 协作\r
\r
```\r
1. error-pattern-learner 分析 backend-develop-expert / frontend-develop-expert 产生的错误\r
2. 生成针对性的预防策略\r
3. 更新 backend-develop-expert / frontend-develop-expert 的指导文档\r
4. backend-develop-expert / frontend-develop-expert 后续执行时应用预防策略\r
```\r
\r
### 与 orchestrator 协作\r
\r
```\r
1. orchestrator 在全局编译后收集所有错误\r
2. 调用 error-pattern-learner 进行模式学习\r
3. error-pattern-learner 返回预防策略\r
4. orchestrator 将策略应用到后续任务\r
```\r
\r
### 与 contract-validator 协作\r
\r
```\r
1. contract-validator 发现契约违反\r
2. 将违反记录传递给 error-pattern-learner\r
3. error-pattern-learner 分析并提取模式\r
4. 生成预防契约违反的策略\r
```\r
\r
