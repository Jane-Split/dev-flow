## 触发条件\r
\r
### 自动触发\r
\r
```yaml\r
auto_triggers:\r
  - trigger: "编译验证失败"\r
    condition: "compile-validation-report.yaml 中 errors > 0"\r
    action: "启动错误模式学习"\r
    \r
  - trigger: "契约验证失败"\r
    condition: "contract-validation-report.yaml 中 violations > 0"\r
    action: "启动错误模式学习"\r
    \r
  - trigger: "测试失败"\r
    condition: "test-failure-report.yaml 中 failures > 0"\r
    action: "启动错误模式学习"\r
    \r
  - trigger: "定期学习"\r
    condition: "每周一次"\r
    action: "扫描所有历史错误，更新模式库"\r
```\r
