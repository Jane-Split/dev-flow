### Step 5: Agent 指导更新\r
\r
#### 5.1 生成 Agent 指导补丁\r
\r
```yaml\r
# agent-guidance-update.yaml\r
guidance_updates:\r
  - target_agent: "backend-develop-expert"\r
    update_type: "step_enhancement"\r
    location: "Step 2.5.3"\r
    content: |\r
      #### 🔴 Entity Getter 方法验证（错误模式 P001 预防）\r
      \r
      > **历史错误**：曾发生 5 次因猜测 getter 方法名导致的编译错误\r
      > **典型场景**：字段 status，实际 getter 为 getInspectionBatchStatus()\r
      \r
      **验证步骤**：\r
      1. 读取 Entity 实际定义\r
      2. 使用 Grep 提取所有 public 方法\r
      3. 确认 getter 方法存在\r
      4. 如不存在，使用模糊匹配查找相似方法\r
      \r
      **常见非标准命名**：\r
      - getStatus() → getInspectionBatchStatus()\r
      - getType() → getOrderType()\r
      - getName() → getProductName()\r
      \r
  - target_agent: "backend-develop-expert"\r
    update_type: "warning_injection"\r
    location: "Step 3 开头"\r
    content: |\r
      > ⚠️ **常见错误提醒**：\r
      > - Mapper 返回类型必须与接口定义一致（模式 P003）\r
      > - DTO 校验注解不可遗漏（模式 P002）\r
      > - Service 参数顺序必须与接口一致（模式 P004）\r
      \r
  - target_agent: "design-expert"\r
    update_type: "best_practice"\r
    location: "Step 3.4"\r
    content: |\r
      ### 结构化业务逻辑设计最佳实践\r
      \r
      **预防逻辑错误**：\r
      1. 每个 validate 必须明确 onFail 处理\r
      2. query 操作后必须检查 null\r
      3. 分支条件必须覆盖所有可能值\r
      4. 状态转换必须定义允许的前置状态\r
```\r
\r
### Step 6: 自动应用策略（🔴 新增 - AI 自动执行）\r
\r
#### 6.1 策略自动应用决策\r
\r
**自动应用条件**：\r
\r
| 条件 | 阈值 | 操作 |\r
|------|------|------|\r
| 模式出现次数 | >= 2 次 | 自动更新 Agent 警告提示 |\r
| 模式出现次数 | >= 5 次 | 自动升级为强制检查项 |\r
| 策略应用后成功率 | > 95% | 自动标记为标准规范 |\r
| 策略应用后成功率 | < 50% | 自动调整策略内容 |\r
\r
**自动应用流程**：\r
\r
```\r
生成预防策略\r
  │\r
  ▼\r
评估应用条件\r
  │\r
  ├── 满足自动应用条件\r
  │     │\r
  │     ▼\r
  │  自动更新 Agent 文件\r
  │     ├── 读取当前 Agent 定义\r
  │     ├── 定位插入位置\r
  │     ├── 添加策略内容\r
  │     └── 保存更新\r
  │     │\r
  │     ▼\r
  │  记录应用日志\r
  │     └── auto-application-log.yaml\r
  │     │\r
  │     ▼\r
  │  下次开发自动生效\r
  │\r
  └── 不满足自动应用条件\r
        │\r
        ▼\r
     标记为待审核\r
        └── 人工确认后应用\r
```\r
\r
