## 检测算法实现\r
\r
### Java 源代码分析\r
\r
```bash\r
#!/bin/bash\r
# analyze-method.sh\r
\r
CLASS_FILE=$1\r
METHOD_NAME=$2\r
\r
echo "分析方法: $METHOD_NAME"\r
\r
# 1. 提取方法体\r
javap -c -p "$CLASS_FILE" | grep -A 100 "$METHOD_NAME" > method_bytecode.txt\r
\r
# 2. 检测日志调用\r
echo "检测日志调用..."\r
grep -c "invokevirtual.*log.*info\\|invokevirtual.*log.*warn\\|invokevirtual.*log.*debug" method_bytecode.txt || echo "0"\r
\r
# 3. 检测外部服务调用\r
echo "检测外部服务调用..."\r
grep -c "invokeinterface.*FeignClient\\|invokevirtual.*Service\\|invokeinterface.*Mapper" method_bytecode.txt || echo "0"\r
\r
# 4. 计算方法复杂度\r
echo "计算方法复杂度..."\r
wc -l < method_bytecode.txt\r
```\r
\r
### 正则表达式模式\r
\r
```yaml\r
patterns:\r
  log_calls:\r
    - "log\\.info\\s*\\("\r
    - "log\\.warn\\s*\\("\r
    - "log\\.debug\\s*\\("\r
    - "log\\.error\\s*\\("\r
    - "LOGGER\\.info\\s*\\("\r
    \r
  external_calls:\r
    feign_client:\r
      - "\\w+FeignClient\\.\\w+\\s*\\("\r
    service:\r
      - "\\w+Service\\.\\w+\\s*\\("\r
    mapper:\r
      - "\\w+Mapper\\.\\w+\\s*\\("\r
    repository:\r
      - "\\w+Repository\\.\\w+\\s*\\("\r
      \r
  business_operations:\r
    database:\r
      - "\\.insert\\s*\\("\r
      - "\\.update\\s*\\("\r
      - "\\.delete\\s*\\("\r
      - "\\.select\\s*\\("\r
    message:\r
      - "\\.sendMessage\\s*\\("\r
      - "\\.publish\\s*\\("\r
    http:\r
      - "\\.post\\s*\\("\r
      - "\\.get\\s*\\("\r
      - "\\.put\\s*\\("\r
```\r
\r
## 集成到编译流程\r
\r
### Maven 集成\r
\r
```xml\r
<!-- pom.xml -->\r
<plugin>\r
    <groupId>dev-flow</groupId>\r
    <artifactId>bytecode-analyzer-maven-plugin</artifactId>\r
    <version>1.0.4</version>\r
    <executions>\r
        <execution>\r
            <phase>compile</phase>\r
            <goals>\r
                <goal>analyze</goal>\r
            </goals>\r
            <configuration>\r
                <failOnCritical>true</failOnCritical>\r
                <designDocPath>${project.basedir}/.dev-flow/design-result.md</designDocPath>\r
            </configuration>\r
        </execution>\r
    </executions>\r
</plugin>\r
```\r
\r
### 在 backend-develop-expert 中调用\r
\r
```yaml\r
# backend-develop-expert.md Step 5.8\r
step_5_8_bytecode_analysis:\r
  name: "字节码分析"\r
  description: "编译后分析字节码，检测日志占位"\r
  \r
  commands:\r
    - "mvn compile"\r
    - "java -jar bytecode-analyzer.jar target/classes"\r
    \r
  validation:\r
    - check: "bytecode-analysis-report.yaml"\r
      must_contain:\r
        - "status: PASSED"\r
      fail_action: "block"\r
      \r
  on_failure:\r
    - "读取 bytecode-analysis-report.yaml"\r
    - "定位所有 CRITICAL 问题"\r
    - "返回 Step 3 修复代码"\r
```\r
\r
## 阈值配置\r
\r
```yaml\r
thresholds:\r
  log_placeholder:\r
    max_log_only_methods: 0\r
    max_log_ratio: 0.3\r
    min_effective_lines: 3\r
    \r
  complexity:\r
    min_external_calls: 1\r
    min_service_calls: 0\r
    min_database_operations: 0\r
    \r
  severity_mapping:\r
    log_only: "CRITICAL"\r
    log_ratio_high: "HIGH"\r
    low_complexity: "MEDIUM"\r
    no_external_calls_when_expected: "CRITICAL"\r
```\r
\r
## 与其他验证 Agent 的关系\r
\r
> **验证 Agent 分工矩阵**（v2.1 明确）：\r
\r
| Agent | 验证维度 | 执行时机 | 执行者 |\r
|-------|---------|---------|--------|\r
| bytecode-analyzer | 编译后字节码/源码深度分析 | 编译完成后（可选） | verify-expert |\r
| design-contract-validator | 设计文档 call action 完整性 | 开发过程中（可选） | backend-develop-expert / frontend-develop-expert |\r
| step-enforcer | 文件存在性、禁止事项、早期覆盖率 | 开发过程中（强制） | backend-develop-expert / frontend-develop-expert |\r
| contract-validator | 结构一致性 + 逻辑覆盖率最终验证 | 开发完成后（强制） | orchestrator |\r
| verify-expert | 代码质量、编译验证、需求满足度 | 最终验证阶段（强制） | orchestrator |\r
\r
- **bytecode-analyzer**：方法级深度分析（复杂度、外部调用特征）\r
- **design-contract-validator**：设计文档完整性验证（call action 定义）\r
- **contract-validator R5**：设计→代码覆盖率验证（最终仲裁）\r
- 三者层层递进，bytecode-analyzer 是最深层的代码质量防线"""
