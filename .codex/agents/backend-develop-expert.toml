### 🔴 前端组件 data-testid 规范（新增）\r
\r
> **目的**：为 UI 层验证（agent-browser）提供稳定的元素定位，避免依赖 CSS 类名或文本内容导致测试不稳定。\r
\r
**规则**：所有涉及 UI 验证的关键交互元素必须添加 `data-testid` 属性。\r
\r
**命名规范**：\r
\r
| 元素类型 | data-testid 格式 | 示例 |\r
|---------|-----------------|------|\r
| 操作按钮 | `{action}-{resource}` | `data-testid="create-user"` |\r
| 删除按钮 | `delete-{resource}-{id}` | `data-testid="delete-user-123"` |\r
| 表单输入 | `input-{field}` | `data-testid="input-username"` |\r
| 下拉选择 | `select-{field}` | `data-testid="select-status"` |\r
| 表格 | `table-{resource}` | `data-testid="table-users"` |\r
| 表格行 | `row-{resource}-{id}` | `data-testid="row-user-123"` |\r
| 弹窗 | `modal-{name}` | `data-testid="modal-create-user"` |\r
| 列表项 | `item-{resource}-{id}` | `data-testid="item-role-1"` |\r
| 搜索框 | `search-{resource}` | `data-testid="search-user"` |\r
| 提交按钮 | `submit-{action}` | `data-testid="submit-create"` |\r
| 取消按钮 | `cancel-{action}` | `data-testid="cancel-create"` |\r
\r
**Vue 组件示例**：\r
\r
```vue\r
<template>\r
  <div>\r
    <button data-testid="create-user" @click="showCreateModal">新增用户</button>\r
    <input data-testid="search-user" v-model="searchText" placeholder="搜索用户" />\r
    <button data-testid="search-submit" @click="search">搜索</button>\r
\r
    <a-modal data-testid="modal-create-user" v-model:visible="createVisible" title="新增用户">\r
      <a-form>\r
        <a-form-item label="用户名">\r
          <a-input data-testid="input-username" v-model:value="form.username" />\r
        </a-form-item>\r
        <a-form-item label="邮箱">\r
          <a-input data-testid="input-email" v-model:value="form.email" />\r
        </a-form-item>\r
      </a-form>\r
      <template #footer>\r
        <a-button data-testid="cancel-create" @click="createVisible = false">取消</a-button>\r
        <a-button data-testid="submit-create" type="primary" @click="handleCreate">提交</a-button>\r
      </template>\r
    </a-modal>\r
\r
    <a-table data-testid="table-users" :dataSource="users" :columns="columns">\r
      <template #bodyCell="{ record }">\r
        <a-button data-testid="delete-user" @click="handleDelete(record.id)">删除</a-button>\r
      </template>\r
    </a-table>\r
  </div>\r
</template>\r
```\r
\r
**React 组件示例**：\r
\r
```tsx\r
<button data-testid="create-user" onClick={showCreateModal}>新增用户</button>\r
<input data-testid="input-username" value={form.username} onChange={handleChange} />\r
<button data-testid="submit-create" type="submit">提交</button>\r
```\r
\r
> **⚠️ 降级兼容**：如果 design-contract.yaml 无 ui_selectors 章节，不强制要求添加 data-testid，但建议添加以提升测试稳定性。\r
