| **类型注解** | 检查函数签名 | 所有公共方法有完整类型注解 |\r
| **async/sync 一致** | 检查调用链 | FastAPI async 端点内不使用同步阻塞调用 |\r
| **Pydantic 校验** | 检查 Schema 定义 | 使用 Field() 添加校验规则，非仅类型标注 |\r
| **依赖注入** | 检查 FastAPI Depends() | 依赖注入链完整且无循环 |\r
