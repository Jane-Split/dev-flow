#### Step 2.5-TS: 强制读取验证\r
\r
在生成任何 TypeScript/Node.js 代码之前，执行以下验证：\r
\r
##### 2.5-TS.1: 读取依赖类定义\r
\r
| 类类型 | 读取方法 | 验证内容 |\r
|--------|---------|---------|\r
| Interface/Type | `Read {file}.ts` | 属性名、类型、可选性 |\r
| Class | `Read {file}.ts` | 方法签名、参数类型、返回类型 |\r
