\r
##### 2.5-TS.2: Import 路径验证\r
\r
TypeScript/Node.js 的 import 路径规则：\r
\r
| 导入类型 | 示例 | 验证方法 |\r
|---------|------|---------|\r
| 相对导入 | `import { User } from './user.entity'` | 确认目标文件存在，扩展名可选 |\r
| 路径别名（tsconfig paths） | `import { User } from '@app/entities'` | `Read tsconfig.json` → `compilerOptions.paths` |\r
| 包导入 | `import { Injectable } from '@nestjs/common'` | 确认 `package.json` 中已有该依赖 |\r
| Barrel 导出 | `import { User } from './entities'` | `Read ./entities/index.ts` 确认重新导出 |\r
\r
**Import 确认表**：\r
```markdown\r
| 导入语句 | 目标文件/包 | package.json 已有 | 路径别名映射 | 状态 |\r
|---------|------------|-------------------|-------------|------|\r
| `import { UserService } from './user.service'` | `user.service.ts` | N/A | N/A | ✅ 文件存在 |\r
| `import { PrismaService } from 'src/prisma/prisma.service'` | `src/prisma/prisma.service.ts` | N/A | `"src/*": ["./src/*"]` | ✅ 别名映射正确 |\r
```\r
\r
##### 2.5-TS.3: 方法签名验证\r
\r
```markdown\r
| 调用位置 | 调用代码 | 目标类 | 实际方法签名 | 状态 |\r
|---------|---------|--------|-------------|------|\r
| user.controller.ts:12 | `userService.create(dto)` | UserService | `create(dto: CreateUserDto): Promise<User>` | ✅ 匹配 |\r
```\r
\r
##### 2.5-TS.4: 类型强制匹配\r
\r
```markdown\r
| 赋值位置 | 赋值代码 | 变量名 | 实际类型 | 状态 |\r
|---------|---------|--------|---------|------|\r
| user.controller.ts:15 | `const id = req.params.id` | req.params.id | `string` | ⚠️ 若需要 number，需 `parseInt()` |\r
| user.service.ts:22 | `user.status = 'active'` | user.status | `UserStatus` (enum) | ⚠️ 需使用 `UserStatus.ACTIVE` |\r
```\r
\r
#### TS 特有检查项\r
\r
| 检查项 | 检查方法 | 通过标准 |\r
|--------|---------|---------|\r
| **strictNullChecks** | 检查 `tsconfig.json` 编译选项 | 若开启，所有可能为 null/undefined 的值必须有类型守卫 |\r
| **async/await** | 检查函数体内的 await 调用 | 所有返回 Promise 的函数调用必须被 await 或 .then() 处理 |\r
| **装饰器** | 确认装饰器参数正确 | 如 NestJS `@Controller('users')`、`@Inject()` |\r
| **模块依赖** | 检查模块的 imports 数组 | 确保使用的 Service 所属模块已导入 |\r
| **循环依赖** | 检查 import 链 | 避免 A → B → A 的循环引用 |\r
\r
#### TS 编码规范\r
\r
```\r
- 优先使用 interface 而非 type（除非需要联合类型）\r
- 使用 readonly 标记不可变属性\r
- 使用 as const 替代枚举（简单场景）\r
- 避免 any，至少使用 unknown\r
- 使用 optional chaining (?.) 和 nullish coalescing (??)\r
- NestJS 项目遵循 Module-Controller-Service 三层架构\r
- Express 项目使用 express-async-errors 处理异步异常\r
```\r
