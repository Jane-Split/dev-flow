#### Go 特有检查项\r
\r
| 检查项 | 检查方法 | 通过标准 |\r
|--------|---------|---------|\r
| **error 处理** | 检查所有返回 error 的调用 | 每个 error 返回值都被检查，无 `_` 忽略 |\r
| **defer 使用** | 检查资源打开后的 defer | 文件、连接等资源打开后立即 defer Close() |\r
| **goroutine 泄漏** | 检查 go func() 内的 context | 所有 goroutine 有退出机制（context.Done/channel close） |\r
| **nil pointer** | 检查指针/接口使用前 | 所有指针/接口/切片/map 使用前有 nil 检查 |\r
| **并发安全** | 检查共享状态访问 | 共享可变状态使用 sync.Mutex 或 channel 保护 |\r
| **接口满足** | 检查 struct 是否实现 interface | 使用 `var _ Interface = (*Struct)(nil)` 编译期断言 |\r
| **命名可见性** | 检查首字母大小写 | 导出符号首字母大写，内部符号首字母小写 |\r
\r
#### Go 编码规范\r
\r
```\r
- 遵循 Effective Go 和 Go Code Review Comments\r
- 错误处理：`if err != nil { return fmt.Errorf("context: %w", err) }`\r
- 使用 context.Context 作为函数第一个参数\r
- 优先返回具体类型，接受接口类型\r
- 使用 gofumpt 或 gofmt 格式化代码\r
- 使用 golangci-lint 进行静态检查\r
- 项目布局遵循 golang-standards/project-layout\r
```\r
