name: dev-flow CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run version check
        run: npm run test:version
      
      - name: Run build
        run: npm run build
      
      - name: Run build verification
        run: npm run verify
      
      - name: Run link checks
        run: npm run test:links
      
      - name: Run size warnings
        run: npm run test:size
      
      - name: Run format checks
        run: npm run test:format
      
      - name: Run all tests
        run: npm test

  build-all-platforms:
    runs-on: ubuntu-latest
    needs: verify
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build all platforms
        run: npm run build
      
      - name: Verify all platforms
        run: npm run verify
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-flow-build
          path: skill-templates/
          retention-days: 7

  publish-check:
    runs-on: ubuntu-latest
    needs: [verify, build-all-platforms]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm install
      
      - name: Pre-publish check
        run: node scripts/pre-publish.js
      
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
